<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StarBuddy · 送一个拥抱</title><link rel="stylesheet" href="/hug.css"></head><body><main>
<p class="eyebrow">STAR BUDDY · 远程拥抱</p><div class="heart" aria-hidden="true">♡</div><h1>送一份小小的关心</h1><p>不需要说很多。让星伴替你传递一句温柔的问候。</p>
<section id="pair-panel"><h2>先在星伴屏幕上授权</h2><p class="small">开启接收 → 显示授权码。此权限只能发送拥抱，不能查看聊天、树洞、日记或媒体。</p><form id="pair-form"><label for="code">6 位拥抱授权码</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required><button id="pair" type="submit">连接这台星伴</button></form></section>
<section id="send-panel" hidden><p id="mode" class="small"></p><div class="choices"><button data-kind="hug"><b>♡</b>轻轻抱抱<small>你可以慢慢来</small></button><button data-kind="cheer"><b>✧</b>为你加油<small>按自己的节奏试一小步</small></button><button data-kind="goodnight"><b>☾</b>晚安问候<small>安安稳稳地休息</small></button></div><button id="refresh" class="secondary">刷新连接状态</button></section>
<p id="status" role="status">正在检查连接…</p><p class="small">授权 1 小时；两次发送间隔至少 20 秒。忙碌、勿扰或过期时不补播。回执不表示对方已看见或听见。首版不上传录音。</p>
</main><script src="/hug.js"></script></body></html>
