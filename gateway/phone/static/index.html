<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09100d"><title>VENTUNO Q</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/mode.css"></head>
<body><header><div><p class="eyebrow">VENTUNO Q · LOCAL MEDIA</p><h1>Hermes 控制台</h1></div><span id="status" class="status">已连接</span></header>
<main class="app-shell"><section id="messages" class="messages" aria-live="polite"><article class="message agent"><span>H</span><div>你好。我可以读取板卡状态并通过受控 Runtime 操作设备。手机麦克风和扬声器连接板端语音模型，摄像头快照由板端 QNN NPU 识别。</div></article></section>
<section class="camera-panel" id="cameraPanel" hidden><video id="camera" autoplay playsinline muted></video><div class="camera-actions"><button id="snapshot" class="secondary">保存快照</button><button id="closeCamera" class="secondary">关闭</button></div></section>
<form id="chatForm" class="composer"><div class="mode-row"><label for="chatMode">对话后端</label><select id="chatMode"><option value="local">板端 Qwen（本地对话）</option><option value="local-agent">本地 Agent（实验·只读状态）</option><option value="agent">Hermes Agent（设备工具）</option></select></div><textarea id="prompt" rows="1" maxlength="4000" placeholder="和板端 Qwen 聊聊…" required></textarea><div class="tools"><button type="button" id="mic" class="icon" aria-label="板端语音对话">麦克风</button><button type="button" id="cameraButton" class="icon" aria-label="打开摄像头">摄像头</button><label class="speak"><input id="autoSpeak" type="checkbox" checked>播放板端语音</label><button type="submit" id="send">发送</button></div></form></main>
<canvas id="canvas" hidden></canvas><script src="/app.js"></script></body></html>
